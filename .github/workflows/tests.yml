name: React checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: React browser behavior with simulated API
        run: npm test
      - run: bash -n scripts/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: react-browser-failures
          path: test-results/
          retention-days: 7
